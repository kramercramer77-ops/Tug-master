<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TUG MASTER 徳山港 — 港の守護神</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061421;color:#e8f4fa;font-family:system-ui,'Noto Sans JP',sans-serif}main{max-width:980px;margin:auto;padding:10px}h1{font-size:clamp(19px,4vw,29px);margin:5px 0 8px;text-align:center;letter-spacing:.04em}.sub{color:#9bb8ca;font-size:12px;text-align:center;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}.stat{background:#112d42;border:1px solid #2a5168;border-radius:9px;text-align:center;padding:5px 2px;font-size:11px;color:#9bc3d8}.stat b{display:block;color:#fff;font-size:clamp(14px,3vw,22px)}canvas{width:100%;height:auto;display:block;background:#123e58;border:1px solid #2e657f;border-radius:12px;touch-action:none}.status{min-height:28px;text-align:center;padding:6px;font-weight:700;color:#f8d782}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:9px}button{background:#175a79;color:#fff;border:1px solid #61a7c6;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:700;touch-action:none;user-select:none;min-width:72px}button:active,.held{background:#3195b4}button.special{background:#a16a17;border-color:#edbb53}button.restart{background:#324459}.guide{text-align:center;color:#a9c4d3;font-size:12px;line-height:1.7;margin:9px 0}.overlay{position:relative}.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#061421c9;border-radius:12px;padding:15px}.panel{max-width:450px;text-align:center;background:#0c2b40;border:1px solid #5f9cb5;border-radius:16px;padding:22px;box-shadow:0 15px 40px #0008}.panel h2{font-size:26px;margin:4px 0 10px}.panel p{line-height:1.6;font-size:14px}.panel button{background:#d99120;border-color:#ffcb75;margin-top:8px}.hidden{display:none}@media(max-width:540px){main{padding:5px}.controls button{padding:12px 10px;min-width:60px;font-size:14px}.panel{padding:13px}.panel h2{font-size:21px}}</style></head><body><main><h1>🚢 TUG MASTER <span style="color:#f9bc48">徳山港</span></h1><div class="sub">ARCADE EDITION — 港の守護神</div><div class="stats"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">TIME<b id="time">90</b></div><div class="stat">STAGE<b id="stage">1</b></div><div class="stat">COMBO<b id="combo">0</b></div><div class="stat">LIVES<b id="lives">♥♥♥</b></div></div><div class="overlay"><canvas id="game" width="900" height="520"></canvas><div id="modal" class="modal"><div class="panel"><h2 id="mtitle">⚓ 港の守護神</h2><p id="mdesc">黄色いタグを操縦し、大型船を右側の緑の着岸エリアへ押し込め！<br>船に近づいて船体を押そう。接近時に「ブースト」で強力アシスト！<br>安全な速度で着岸すれば成功。</p><button id="start">出港する！ ▶</button></div></div></div><div class="status" id="status">読み込み中…（このままなら外部ブラウザで開いてください）</div><div class="controls"><button data-key="left">↶ 左旋回</button><button data-key="forward">▲ 前進</button><button data-key="back">▼ 後進</button><button data-key="right">↷ 右旋回</button><button data-key="boost" class="special">⚡ ブースト</button><button id="pause" class="restart">⏸ 一時停止</button></div><div class="guide">PC：矢印キーで操船・スペースでブースト・Pで一時停止<br>スマホ：ボタン長押し。船を右側へ押し、緑色の岸壁前でゆっくり着岸させよう。</div></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=900,H=520,$=id=>document.getElementById(id);let state='menu',keys={},score=0,combo=0,stage=1,lives=3,remaining=90,tug,ship,particles=[],message='',messageUntil=0,elapsed=0,last=0,boostEnergy=100,transition=0,wind=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>a+Math.random()*(b-a);function mission(){const names=['貨物船','石油タンカー','大型バルカー','コンテナ船','LNG船'];ship={x:425,y:rand(190,315),vx:0,vy:0,len:stage%3===0?205:stage%2===0?185:165,width:stage%3===0?73:62,name:names[(stage-1)%names.length],color:['#c2a277','#b7b9bf','#ba875e','#9aadb9','#e2d7bd'][(stage-1)%5]};tug={x:245,y:ship.y+rand(-45,45),a:0,v:0};remaining=Math.max(45,90-(stage-1)*4);boostEnergy=100;wind=(stage>1?rand(-.018,.018)*(1+stage*.1):0);message=`第${stage}船：${ship.name}を着岸させろ！`;messageUntil=elapsed+2.5;transition=0;updateHUD()}function reset(){score=0;combo=0;stage=1;lives=3;elapsed=0;particles=[];mission();state='playing';$('modal').classList.add('hidden')}function updateHUD(){$('score').textContent=score.toLocaleString();$('time').textContent=Math.ceil(remaining);$('stage').textContent=stage;$('combo').textContent=combo;$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}function pop(text){message=text;messageUntil=elapsed+2.5}function finish(win){state='ended';$('mtitle').textContent=win?'🏆 港の英雄！':'⚓ 任務終了';$('mdesc').innerHTML=`最終スコア：<b style="font-size:26px;color:#ffcb70">${score.toLocaleString()}</b><br>到達ステージ：${stage}<br>安全第一、もう一度挑戦しよう！`;$('start').textContent='もう一度プレイ ▶';$('modal').classList.remove('hidden')}function sparks(px,py,color){for(let i=0;i<25;i++)particles.push({x:px,y:py,vx:rand(-4,4),vy:rand(-4,4),life:rand(.3,1),color})}function fail(reason){if(state!=='playing'||transition)return;lives--;combo=0;pop('💥 '+reason+'　残りライフ '+lives);sparks(ship.x,ship.y,'#ff7b4d');transition=1.6;updateHUD()}function success(){if(transition)return;combo++;let gain=Math.round((700+remaining*12)*Math.min(combo,5));score+=gain;pop(`🎉 着岸成功！ +${gain}点 / ${combo} COMBO`);sparks(ship.x+100,ship.y,'#77f0a7');transition=1.7;updateHUD()}function step(dt){elapsed+=dt;particles=particles.filter(p=>(p.life-=dt)>0);for(const p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60}if(state!=='playing')return;if(transition>0){transition-=dt;if(transition<=0){if(lives<=0)finish(false);else{if(ship.x>610&&ship.x<735&&Math.abs(ship.y-260)<50){stage++;}else if(message.includes('着岸成功'))stage++;mission()}}return}remaining-=dt;if(remaining<=0){fail('時間切れ！');return}const k=dt*60;if(keys.left)tug.a-=.047*k;if(keys.right)tug.a+=.047*k;if(keys.forward)tug.v=clamp(tug.v+.085*k,-2,3.9);if(keys.back)tug.v=clamp(tug.v-.085*k,-2.1,3.9);tug.v*=Math.pow(.972,k);tug.x+=Math.cos(tug.a)*tug.v*k;tug.y+=Math.sin(tug.a)*tug.v*k;tug.x=clamp(tug.x,22,720);tug.y=clamp(tug.y,24,496);boostEnergy=clamp(boostEnergy+(keys.boost?-.6:.26)*k,0,100);let dx=ship.x-tug.x,dy=ship.y-tug.y,d=Math.hypot(dx,dy);if(d<130&&d>12){let nx=dx/d,ny=dy/d,heading=Math.cos(tug.a)*nx+Math.sin(tug.a)*ny;let pushing=Math.max(0,tug.v*heading);if(pushing>0){let power=(keys.boost&&boostEnergy>1?2.4:1);let impulse=(130-d)/130*.073*pushing*power*k;ship.vx+=nx*impulse;ship.vy+=ny*impulse;tug.v*=Math.pow(.984,k);if(Math.random()<.13)particles.push({x:tug.x+nx*30,y:tug.y+ny*15,vx:rand(-1,1),vy:rand(-1,1),life:.4,color:'#b7e6f5'})}}ship.vx+=.002*k;ship.vy+=wind*k;ship.vx*=Math.pow(.985,k);ship.vy*=Math.pow(.985,k);ship.x+=ship.vx*k;ship.y+=ship.vy*k;if(ship.y<55||ship.y>465||ship.x<105){fail('航路逸脱！');return}let speed=Math.hypot(ship.vx,ship.vy);if(ship.x+ship.len/2>=735){if(Math.abs(ship.y-260)<49&&speed<1.3){success()}else fail(speed>=1.3?'岸壁に高速接触！':'着岸位置が違う！');return}if(ship.x>625&&ship.x<735&&Math.abs(ship.y-260)<48&&speed<.34){success();return}updateHUD()}
function drawBoat(px,py,a,len,w,color,tag){ctx.save();ctx.translate(px,py);ctx.rotate(a);ctx.shadowColor='#0008';ctx.shadowBlur=9;ctx.shadowOffsetY=4;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(len*.5,0);ctx.lineTo(len*.36,-w*.5);ctx.lineTo(-len*.46,-w*.5);ctx.quadraticCurveTo(-len*.55,0,-len*.46,w*.5);ctx.lineTo(len*.36,w*.5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=tag?'#172a32':'#3a4348';ctx.fillRect(-len*.35,-w*.32,len*.1,w*.64);ctx.fillStyle=tag?'#f6f3d4':'#e9f0f2';ctx.fillRect(-len*.16,-w*.29,len*.29,w*.58);ctx.fillStyle='#3b7187';ctx.fillRect(-len*.05,-w*.22,len*.1,w*.44);ctx.fillStyle='#172f3d';ctx.fillRect(len*.25,-w*.34,len*.04,w*.68);ctx.restore()}
function render(){const t=elapsed;ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d344e');bg.addColorStop(1,'#185371');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<48;i++){let x=(i*127+31)%740,y=(i*79+19)%H;ctx.strokeStyle='rgba(169,228,247,.13)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+Math.sin(t+i)*4,y);ctx.lineTo(x+28+Math.sin(t+i)*4,y);ctx.stroke()}ctx.fillStyle='#69757a';ctx.fillRect(750,0,150,H);ctx.fillStyle='#4a565c';for(let i=0;i<12;i++)ctx.fillRect(750,i*45+3,150,2);ctx.fillStyle='#e5b65a';for(let i=0;i<18;i++)ctx.fillRect(746,i*30,5,16);ctx.fillStyle='#2e9e73';ctx.fillRect(738,187,12,146);ctx.fillStyle='#d2f6de';ctx.font='bold 17px system-ui';ctx.fillText('着岸エリア',757,173);ctx.strokeStyle='#80f5b3';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.strokeRect(610,199,128,122);ctx.setLineDash([]);ctx.fillStyle='#fff9';ctx.font='bold 23px system-ui';ctx.fillText('TOKUYAMA PORT',23,36);ctx.font='14px system-ui';ctx.fillStyle='#c7e2ee';ctx.fillText('徳山下松港 ・ 工業港エリア',25,58);ctx.fillStyle='#344c56';ctx.fillRect(772,355,110,125);ctx.fillStyle='#9db4bb';for(let i=0;i<4;i++)ctx.fillRect(780+i*25,366,16,86);ctx.fillStyle='#f7bc4e';ctx.fillRect(774,347,100,7);if(ship){drawBoat(ship.x,ship.y,0,ship.len,ship.width,ship.color,false);ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#f6f6f6';ctx.fillText(ship.name,ship.x,ship.y-ship.width/2-13);ctx.textAlign='left'}if(tug){drawBoat(tug.x,tug.y,tug.a,63,34,'#ffbd38',true);ctx.strokeStyle='#fbd66e88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tug.x,tug.y);ctx.lineTo(tug.x+Math.cos(tug.a)*78,tug.y+Math.sin(tug.a)*78);ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#082338c9';ctx.fillRect(16,465,226,38);ctx.fillStyle='#d4e8f1';ctx.font='13px system-ui';ctx.fillText('⚡ BOOST',25,480);ctx.fillStyle='#264b5c';ctx.fillRect(25,487,198,9);ctx.fillStyle=boostEnergy>25?'#f5b843':'#e7675c';ctx.fillRect(25,487,198*boostEnergy/100,9);if(stage>1){ctx.fillStyle='#082338c9';ctx.fillRect(260,470,180,27);ctx.fillStyle='#e1f3fc';ctx.fillText('🌬 潮流・風の影響あり',271,488)}$('status').textContent=state==='paused'?'⏸ 一時停止中':elapsed<messageUntil?message:state==='playing'?`船を右の緑エリアへ！　接岸速度を落とせ　|　残り ${Math.ceil(remaining)} 秒`:'「出港する！」を押して開始'}let raf;function loop(now){if(!last)last=now;let dt=Math.min((now-last)/1000,.04);last=now;step(dt);render();raf=requestAnimationFrame(loop)}$('start').onclick=()=>{reset();last=performance.now()};$('pause').onclick=()=>{if(state==='playing'){state='paused';$('pause').textContent='▶ 再開'}else if(state==='paused'){state='playing';$('pause').textContent='⏸ 一時停止'}};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.setPointerCapture)try{b.setPointerCapture(e.pointerId)}catch(_){}keys[k]=true;b.classList.add('held')});b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true;b.classList.add('held')},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false;b.classList.remove('held')},{passive:false});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('held')})});const mapping={ArrowUp:'forward',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right',Space:'boost'};window.addEventListener('keydown',e=>{if(mapping[e.code]){e.preventDefault();keys[mapping[e.code]]=true}if(e.code==='KeyP'&&!e.repeat)$('pause').click()});window.addEventListener('keyup',e=>{if(mapping[e.code])keys[mapping[e.code]]=false});window.addEventListener('blur',()=>{keys={};if(state==='playing')$('pause').click()});render();requestAnimationFrame(loop)})();
</script></body></html>
