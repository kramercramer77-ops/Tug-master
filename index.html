<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TUG MASTER Ver.4</title><style>*{box-sizing:border-box}body{margin:0;background:#081b2c;color:#fff;font-family:system-ui,-apple-system,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#102a40;font-weight:800}small{color:#9cc4d6}.wrap{max-width:850px;margin:auto}canvas{display:block;width:100%;background:#123c57;touch-action:none}.radio{background:#183d53;border-left:5px solid #ffcb54;padding:10px 12px;min-height:66px}.radio strong{display:block;font-size:17px}.stats{display:flex;gap:12px;justify-content:space-between;font-size:12px;padding:8px 10px;background:#0e283a}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.panel{background:#102d43;border-radius:12px;padding:10px}.panel h3{font-size:12px;margin:0 0 7px;color:#b5d6e5}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{background:#285471;color:#fff;border:1px solid #50809b;border-radius:9px;padding:12px 3px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;font-size:13px}button:active,button.active{background:#f5b63d;color:#162331}button.sel{background:#2e8b72}.wide{grid-column:span 3}.notice{font-size:12px;color:#b5d6e5;padding:0 12px 12px;line-height:1.5}#start{background:#f2b63e;color:#122b40;border:0;padding:12px 22px}.modal{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);background:#092339ee;border:1px solid #8db7cd;border-radius:16px;padding:24px;text-align:center;width:min(88%,350px);z-index:5}.stage{position:relative}#message{font-size:13px;color:#d9e6eb}#status{color:#ffdb76}</style></head><body><div class="wrap"><header><span>🚢 TUG MASTER <small>Ver.4</small></span><span id="score">0 PTS</span></header><div class="radio"><small>📻 本船からの指令</small><strong id="order">出港準備。開始を押してください。</strong><div id="message">操船して指定位置へ向かおう</div></div><div class="stats"><span id="stageLabel">STAGE 1</span><span id="status">待機中</span><span id="timer">残り 120秒</span></div><div class="stage"><canvas id="sea" width="800" height="500"></canvas><div class="modal" id="modal"><h2 id="modalTitle">TUG MASTER</h2><p id="modalText">本船からの無線に従い、タグを操船して着岸を支援せよ！</p><button id="start">出港する！</button></div></div><div class="controls"><div class="panel"><h3>🕹️ 操船（長押し）</h3><div class="buttons"><button id="left">↶ 左旋回</button><button id="forward">▲ 前進</button><button id="right">右旋回 ↷</button><button id="stop">停止</button><button id="reverse">▼ 後進</button><button id="rope">索を取る</button></div></div><div class="panel"><h3>⚓ 作業操作</h3><div class="buttons"><button data-act="push">押す</button><button data-act="pull">引く</button><button data-act="idle" class="sel">待機</button><button data-power="0">STOP</button><button data-power="0.35">SLOW</button><button data-power="0.7">HALF</button><button data-power="1" class="wide">FULL</button></div></div></div><div class="notice">黄色があなたのタグ。青色はAIタグ。白い丸が担当位置。引き作業では「索を取る」で接続し、適切な距離を保って引く。指令に合う作業と出力で本船を安全に岸壁へ寄せよう。PCは矢印キーでも操船可能。</div></div><script>
(()=>{'use strict';const c=document.getElementById('sea'),g=c.getContext('2d');const $=id=>document.getElementById(id);const W=800,H=500;let running=false,stage=1,score=0,time=120,boat,ship,ais=[],cmd,cmdIndex=0,cmdTime=0,hold={},act='idle',power=0,rope=false,feedback='',feedbackUntil=0,last=0,missionStart=0,collisionPenalty=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const configs=[{name:'小型貨物船',length:155,ais:0},{name:'中型タンカー',length:205,ais:1},{name:'大型タンカー',length:245,ais:2},{name:'VLCC級',length:275,ais:2}];let cfg;function startStage(){cfg=configs[Math.min(stage-1,3)];time=Math.max(105,145-stage*9);ship={x:330,y:210,vx:0,vy:0,angle:0,omega:0,length:cfg.length};boat={x:160,y:370,a:-Math.PI/2,v:0};ais=[];for(let i=0;i<cfg.ais;i++)ais.push({x:ship.x+(i?ship.length*.38:-ship.length*.38),y:ship.y-42,side:i?1:-1});cmdIndex=0;cmdTime=0;rope=false;act='idle';power=0;missionStart=performance.now();collisionPenalty=0;setButtons();setCommand();$('stageLabel').textContent='STAGE '+stage+' ・ '+cfg.name;$('status').textContent='作業中';$('modal').style.display='none';running=true}function setCommand(){let types=['position','push','pull','push','stop'];let type=types[cmdIndex%types.length];let side=stage%2===0?-1:1;cmd={type,side,power:type==='push'?0.7:type==='pull'?0.35:0};let msg=type==='position'?'船首タグ、'+(side>0?'右舷':'左舷')+'側に配置！':type==='push'?'船首タグ、押し方 '+(cmd.power===.7?'ハーフ':'スロー')+'！':type==='pull'?'船首タグ、引き方 スロー！':'船首タグ、ストップ！';$('order').textContent=msg;$('message').textContent=type==='position'?'白い丸へ移動せよ':type==='pull'?'指定位置で索を取り、引く':type==='push'?'本船の舷側へ接近して押す':'出力をSTOPにする';cmdTime=0}function setButtons(){document.querySelectorAll('[data-act]').forEach(b=>b.classList.toggle('sel',b.dataset.act===act));document.querySelectorAll('[data-power]').forEach(b=>b.classList.toggle('sel',+b.dataset.power===power))}function flash(t){feedback=t;feedbackUntil=performance.now()+1700;$('message').textContent=t}function bindHold(id,key){let b=$(id);const down=e=>{e.preventDefault();hold[key]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();hold[key]=false;b.classList.remove('active')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up))}bindHold('forward','f');bindHold('reverse','b');bindHold('left','l');bindHold('right','r');$('stop').onclick=()=>{boat.v=0;hold={};act='idle';power=0;setButtons()};$('rope').onclick=()=>{if(!running)return;let p=attachPoint();if(dist(boat,p)<110){rope=!rope;flash(rope?'曳航索 接続完了！':'曳航索 解放')}else flash('索取り位置まで近づけ！')};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{act=b.dataset.act;setButtons()});document.querySelectorAll('[data-power]').forEach(b=>b.onclick=()=>{power=+b.dataset.power;setButtons()});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowUp')hold.f=true;if(e.key==='ArrowDown')hold.b=true;if(e.key==='ArrowLeft')hold.l=true;if(e.key==='ArrowRight')hold.r=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowUp')hold.f=false;if(e.key==='ArrowDown')hold.b=false;if(e.key==='ArrowLeft')hold.l=false;if(e.key==='ArrowRight')hold.r=false});window.addEventListener('blur',()=>hold={});$('start').onclick=()=>{stage=1;score=0;startStage()};function attachPoint(){return{x:ship.x-ship.length*.38,y:ship.y+cmd.side*33}}function target(){return{x:ship.x-ship.length*.35,y:ship.y+cmd.side*(cmd.type==='pull'?95:57)}}function next(){score+=Math.max(20,Math.round(100-time*.05));cmdIndex++;setCommand()}function finish(success){running=false;$('modal').style.display='block';$('modalTitle').textContent=success?'着岸成功！ 🎉':'作業失敗';$('modalText').textContent=success?'安全着岸ボーナス +'+Math.round(time*8)+'点。次の大型船へ！':'制限時間超過または危険接触。再挑戦！';$('start').textContent=success?'次のステージへ':'もう一度挑戦';$('start').onclick=()=>{if(success){score+=Math.round(time*8);stage++}startStage()}}function update(dt){if(!running)return;dt=Math.min(dt,.04);time-=dt;if(time<=0){finish(false);return}let turn=(hold.r?1:0)-(hold.l?1:0);boat.a+=turn*2.15*dt;let thrust=(hold.f?1:0)-(hold.b?1:0);boat.v=clamp(boat.v+thrust*145*dt,-85,115);boat.v*=Math.pow(.985,dt*60);boat.x=clamp(boat.x+Math.cos(boat.a)*boat.v*dt,20,W-20);boat.y=clamp(boat.y+Math.sin(boat.a)*boat.v*dt,20,H-20);let pt=target(),near=dist(boat,pt)<68;cmdTime+=dt;const contact=dist(boat,{x:clamp(boat.x,ship.x-ship.length/2,ship.x+ship.length/2),y:ship.y+cmd.side*27})<37;let success=false;let strength=0;if(cmd.type==='position'&&near&&Math.abs(boat.v)<75)success=cmdTime>1;if(cmd.type==='stop'&&power===0&&act==='idle')success=cmdTime>1.3;if(cmd.type==='push'&&act==='push'&&power>0&&contact){strength=power*36;if(Math.abs(power-cmd.power)<.12)success=cmdTime>2.3}if(cmd.type==='pull'&&act==='pull'&&power>0&&rope){let d=dist(boat,attachPoint());if(d>42&&d<155){strength=-power*26;if(Math.abs(power-cmd.power)<.12)success=cmdTime>2.5}if(d>180){rope=false;flash('曳航索が切れた！ -100');score=Math.max(0,score-100)}}if(act==='push'&&power>0&&contact&&cmd.type!=='push')strength=power*12;if(act==='pull'&&rope&&power>0&&cmd.type!=='pull')strength=-power*8;ship.vy+=(strength*.16+ais.length*1.3)*dt;ship.vy*=Math.pow(.985,dt*60);ship.y+=ship.vy*dt;ship.x+=Math.sin(performance.now()/6000)*.018;ship.angle+=(Math.sin(performance.now()/2100)*.00012+strength*.000003)*dt*60;ship.angle=clamp(ship.angle,-.11,.11);if(Math.abs(boat.v)>95&&contact){collisionPenalty+=dt;if(collisionPenalty>.4){score=Math.max(0,score-60);flash('危険な接触！ -60');collisionPenalty=-2}}if(success){score+=cmd.type==='position'?140:cmd.type==='stop'?90:220;flash('指令達成！ +BONUS');next()}if(cmdTime>19){score=Math.max(0,score-60);flash('指令遅延 -60');next()}if(ship.y>405){if(Math.abs(ship.vy)>20){finish(false)}else finish(true)}$('score').textContent=score+' PTS';$('timer').textContent='残り '+Math.ceil(time)+'秒';$('status').textContent=rope?'索 接続中':'索 未接続'}function drawBoat(x,y,a,color,label){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=color;g.strokeStyle='#071a27';g.lineWidth=3;g.beginPath();g.moveTo(22,0);g.lineTo(9,-12);g.lineTo(-17,-11);g.quadraticCurveTo(-24,0,-17,11);g.lineTo(9,12);g.closePath();g.fill();g.stroke();g.fillStyle='#e9f4f7';g.fillRect(-4,-6,11,12);g.restore();g.fillStyle='#fff';g.font='bold 13px system-ui';g.textAlign='center';g.fillText(label,x,y-23)}function draw(){g.clearRect(0,0,W,H);g.fillStyle='#124663';g.fillRect(0,0,W,H);g.strokeStyle='#2c6580';g.lineWidth=1;for(let x=0;x<W;x+=45){g.beginPath();g.moveTo(x,0);g.lineTo(x+40,H);g.stroke()}g.fillStyle='#777d7f';g.fillRect(0,445,W,55);g.fillStyle='#c8b47e';g.fillRect(0,438,W,8);for(let x=20;x<W;x+=65){g.fillStyle='#e6d56d';g.fillRect(x,441,22,4)}g.fillStyle='#e7eff2';g.font='bold 18px system-ui';g.fillText('着岸岸壁',660,475);g.save();g.translate(ship?ship.x:330,ship?ship.y:210);g.rotate(ship?ship.angle:0);let len=ship?ship.length:155;g.fillStyle='#b4c1c7';g.strokeStyle='#263747';g.lineWidth=4;g.beginPath();g.moveTo(-len/2+17,-32);g.lineTo(len/2-26,-32);g.quadraticCurveTo(len/2+8,0,len/2-26,32);g.lineTo(-len/2+17,32);g.quadraticCurveTo(-len/2-5,0,-len/2+17,-32);g.fill();g.stroke();g.fillStyle='#d86f44';for(let i=-2;i<=2;i++)g.fillRect(i*29-10,-22,23,44);g.fillStyle='#fff';g.fillRect(-len/2+9,-23,28,46);g.restore();if(ship){g.fillStyle='#fff';g.font='bold 15px system-ui';g.fillText(cfg.name,ship.x,ship.y-48);let t=target();g.setLineDash([7,7]);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(t.x,t.y,24,0,Math.PI*2);g.stroke();g.setLineDash([]);for(let i=0;i<ais.length;i++){let ai=ais[i],ax=ship.x+(i?ship.length*.38:-ship.length*.38),ay=ship.y-48;drawBoat(ax,ay,Math.PI/2,'#54c2ec','AI '+(i+1));g.strokeStyle='#9adbe9';g.lineWidth=2;g.beginPath();g.moveTo(ax,ay);g.lineTo(ax,ship.y-32);g.stroke()}if(rope){let p=attachPoint();g.strokeStyle='#ffdc75';g.lineWidth=3;g.beginPath();g.moveTo(boat.x,boat.y);g.lineTo(p.x,p.y);g.stroke()}drawBoat(boat.x,boat.y,boat.a,'#ffcb43','YOU');if(feedbackUntil>performance.now()){g.fillStyle='#062033df';g.fillRect(210,15,380,39);g.fillStyle='#ffdf76';g.font='bold 19px system-ui';g.textAlign='center';g.fillText(feedback,400,41)}}}function loop(now){let dt=last?(now-last)/1000:0;last=now;update(dt);draw();requestAnimationFrame(loop)}boat={x:160,y:370,a:-Math.PI/2,v:0};ship={x:330,y:210,angle:0,length:155};cfg=configs[0];draw();requestAnimationFrame(loop)})();
</script></body></html>
